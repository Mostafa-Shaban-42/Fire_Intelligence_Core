services:

  fire-intelligence-core:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: fire-intelligence-core

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://127.0.0.1:8000/health"
        ]

      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    networks:
      - fire-intelligence


networks:

  fire-intelligence:
    driver: bridge