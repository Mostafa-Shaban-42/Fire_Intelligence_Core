[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "fire-intelligence-core"
version = "0.1.0"
description = "Real-time fire and smoke intelligence engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

authors = [
    { name = "Fire Intelligence Core Contributors" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0"
]


[project.scripts]
fire-intelligence = "main:main"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
python_classes = [
    "Test*"
]
python_functions = [
    "test_*"
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]
asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]
ignore = [
    "E501"
]


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "union-attr", "name-defined"]
exclude = [
    "^tests/",
    "^scripts/",
    "^dashboard/"
]